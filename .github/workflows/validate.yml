name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Parse RDF and SPARQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph
          from rdflib.plugins.sparql import prepareQuery

          ttl_files = sorted(Path(".").rglob("*.ttl"))
          if not ttl_files:
              raise SystemExit("No Turtle files found.")

          for path in ttl_files:
              Graph().parse(path, format="turtle")
              print(f"RDF OK     {path}")

          query_files = sorted(Path("queries").glob("*.rq"))
          if not query_files:
              raise SystemExit("No SPARQL query files found.")

          for path in query_files:
              prepareQuery(path.read_text(encoding="utf-8"))
              print(f"SPARQL OK  {path}")
          PY

      - name: Validate examples with SHACL
        run: |
          pyshacl -s shapes/GMOnt.shacl.ttl -e GMOnt.ttl examples/family-memory.ttl
          pyshacl -s shapes/GMOnt.shacl.ttl -e GMOnt.ttl examples/building-lifecycle.ttl
